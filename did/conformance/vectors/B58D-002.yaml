invariant: B58D-002
operation: base58btcDecode

vectors:
  - id: v1
    title: the digit 0 is refused where it stands, as a plain codec error
    from: brief
    given:
      encoded: "0"
    expect:
      throws:
        name: Error
        message: "base58btc: invalid character \"0\" at position 0"

  - id: v2
    title: an offending character fails at its own position, not the start of the input
    from: brief
    given:
      encoded: 1O
    expect:
      throws:
        name: Error
        message: "base58btc: invalid character \"O\" at position 1"

  - id: v3
    title: the letter I is refused where it stands
    from: brief
    given:
      encoded: I
    expect:
      throws:
        name: Error
        message: "base58btc: invalid character \"I\" at position 0"

  - id: v4
    title: the letter l is refused where it stands
    from: brief
    given:
      encoded: l
    expect:
      throws:
        name: Error
        message: "base58btc: invalid character \"l\" at position 0"
