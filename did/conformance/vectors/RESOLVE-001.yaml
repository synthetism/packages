invariant: RESOLVE-001
operation: publicKeyFromDidKey

vectors:
  - id: v1
    title: the key that went in comes back out, byte for byte, in lowercase
    from: brief
    given:
      did: did:key:z6MkuSWDVBasnYTB2AuZvVSVkxtx5D11qvSLErboUkWmB3Xk
    expect:
      publicKeyHex: deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef

  - id: v2
    title: a leading zero byte in the key survives the round trip
    from: brief
    given:
      did: did:key:z6MkeWez1EnKsEND6Lvvny4AM5PZSCfg2YzuBEZhDAxTguqw
    expect:
      publicKeyHex: 00deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbe
