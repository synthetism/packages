invariant: GUARD-001
operation: isDidKey

vectors:
  - id: v1
    title: a resolvable did:key is accepted
    from: code
    given:
      value: did:key:z6MkrL8otjELxqEcmQZHM11UE1n9czAYSWNLQKRfXQH1ypnw
    expect:
      result: true

  - id: v2
    title: a DID URL carrying a fragment is accepted
    from: code
    given:
      value: did:key:z6MkrL8otjELxqEcmQZHM11UE1n9czAYSWNLQKRfXQH1ypnw#key-1
    expect:
      result: true

  - id: v3
    title: a non-string input returns false instead of throwing
    from: code
    given:
      value: 42
    expect:
      result: false

  - id: v4
    title: a null input returns false instead of throwing
    from: code
    given:
      value: null
    expect:
      result: false

  - id: v5
    title: a string with an invalid base58 character returns false
    from: code
    given:
      value: did:key:z0abc
    expect:
      result: false

  - id: v6
    title: another DID method returns false
    from: code
    given:
      value: did:web:example.com
    expect:
      result: false
