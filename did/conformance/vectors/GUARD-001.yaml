invariant: GUARD-001
operation: isDidKey

vectors:
  - id: v1
    title: a bare resolvable did:key is accepted
    from: brief
    given:
      value: did:key:z6MkuSWDVBasnYTB2AuZvVSVkxtx5D11qvSLErboUkWmB3Xk
    expect:
      result: true

  - id: v2
    title: a DID URL over a resolvable did:key is accepted — true means resolvable, not bare
    from: brief
    given:
      value: did:key:z6MkuSWDVBasnYTB2AuZvVSVkxtx5D11qvSLErboUkWmB3Xk#key-1
    expect:
      result: true

  - id: v3
    title: a non-string is false, never a throw
    from: brief
    given:
      value: 42
    expect:
      result: false

  - id: v4
    title: a did:key-shaped string that does not decode is false
    from: brief
    given:
      value: did:key:z0abc
    expect:
      result: false

  - id: v5
    title: another DID method is false
    from: brief
    given:
      value: did:web:synthetism.invalid
    expect:
      result: false

  - id: v6
    title: a whitespace-padded did:key is false — the guard does not trim
    from: brief
    given:
      value: " did:key:z6MkuSWDVBasnYTB2AuZvVSVkxtx5D11qvSLErboUkWmB3Xk "
    expect:
      result: false

  - id: v7
    title: a did:key for another curve is false — resolvable means resolvable as Ed25519
    from: brief
    given:
      value: did:key:z6LSrfRLRF9JYTgT14SdmZzcETZS6nGH8eN8RpQZ8wCGyCX8
    expect:
      result: false

  - id: v8
    title: a DID URL carrying a path and query is accepted, same as a fragment
    from: brief
    given:
      value: did:key:z6MkuSWDVBasnYTB2AuZvVSVkxtx5D11qvSLErboUkWmB3Xk/path?service=agent
    expect:
      result: true

  - id: v9
    title: null is false, never a throw — non-strings are not keys
    from: brief
    given:
      value: null
    expect:
      result: false
