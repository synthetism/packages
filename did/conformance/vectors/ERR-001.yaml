invariant: ERR-001
operation: publicKeyFromDidKey

vectors:
  - id: v1
    title: a fault the codec detected surfaces from the DID layer as a DidKeyError
    from: brief
    given:
      did: did:key:z0abc
    expect:
      throws:
        name: DidKeyError
        message: "invalid base58btc payload in \"did:key:z0abc\" (invalid character \"0\" at position 0)"

  - id: v2
    title: every codec fault is wrapped, not just the one already pinned
    from: brief
    given:
      did: did:key:zIabc
    expect:
      throws:
        name: DidKeyError
        message: "invalid base58btc payload in \"did:key:zIabc\" (invalid character \"I\" at position 0)"
