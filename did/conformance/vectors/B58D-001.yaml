invariant: B58D-001
operation: base58btcDecode

vectors:
  - id: v1
    title: no characters decode to no bytes
    from: brief
    given:
      encoded: ""
    expect:
      bytesHex: ""

  - id: v2
    title: three leading 1 characters decode to three leading zero bytes
    from: brief
    given:
      encoded: 1115Q
    expect:
      bytesHex: 000000ff

  - id: v3
    title: a DID's body decodes to the multicodec prefix joined to the key
    from: brief
    given:
      encoded: 6MkuSWDVBasnYTB2AuZvVSVkxtx5D11qvSLErboUkWmB3Xk
    expect:
      bytesHex: ed01deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef
