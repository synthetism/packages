invariant: DIDKEY-002
operation: didKeyFromPublicKey

vectors:
  - id: v1
    title: one byte short is the wrong length, not a key
    from: brief
    given:
      publicKeyHex: deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbe
    expect:
      throws:
        name: DidKeyError
        message: "expected a 32-byte Ed25519 public key, got 31 bytes"

  - id: v2
    title: one byte past is the wrong length, not a key
    from: brief
    given:
      publicKeyHex: deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef00
    expect:
      throws:
        name: DidKeyError
        message: "expected a 32-byte Ed25519 public key, got 33 bytes"

  - id: v3
    title: an odd number of digits is not hex at all
    from: brief
    given:
      publicKeyHex: f00ba
    expect:
      throws:
        name: DidKeyError
        message: "expected an even-length hex string, got \"f00ba\""

  - id: v4
    title: an even-length string with non-hex characters is refused, and the message names the real fault
    from: brief
    given:
      publicKeyHex: zzdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefcafe00
    expect:
      throws:
        name: DidKeyError
        message: "expected hex characters, got \"zzdeadbeefdeadbeefdeadbeefdeadbe…\""

  - id: v5
    title: an overlong malformed input is refused with a bounded message, never echoed whole
    from: brief
    given:
      publicKeyHex: zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz
    expect:
      throws:
        name: DidKeyError
        message: "expected hex characters, got \"zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz…\""
