invariant: RESOLVE-002
operation: publicKeyFromDidKey

vectors:
  - id: v1
    title: a fragment names a key within the DID, never another key
    from: brief
    given:
      did: did:key:z6MkuSWDVBasnYTB2AuZvVSVkxtx5D11qvSLErboUkWmB3Xk#key-1
    expect:
      publicKeyHex: deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef

  - id: v2
    title: a path and a query resolve to the base DID's key
    from: brief
    given:
      did: did:key:z6MkuSWDVBasnYTB2AuZvVSVkxtx5D11qvSLErboUkWmB3Xk/path?service=agent
    expect:
      publicKeyHex: deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef

  - id: v3
    title: whatever follows the first delimiter is stripped, whichever delimiter comes first
    from: brief
    given:
      did: did:key:z6MkuSWDVBasnYTB2AuZvVSVkxtx5D11qvSLErboUkWmB3Xk?service=agent#key-1
    expect:
      publicKeyHex: deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef
