invariant: RESOLVE-003
operation: publicKeyFromDidKey

vectors:
  - id: v1
    title: another DID method is refused, not resolved
    from: brief
    given:
      did: did:web:synthetism.invalid
    expect:
      throws:
        name: DidKeyError
        message: "not a did:key: \"did:web:synthetism.invalid\""

  - id: v2
    title: a non-z multibase prefix is refused before any decoding — case included
    from: brief
    given:
      did: did:key:Z6MkuSWDVBasnYTB2AuZvVSVkxtx5D11qvSLErboUkWmB3Xk
    expect:
      throws:
        name: DidKeyError
        message: "unsupported multibase prefix in \"did:key:Z6MkuSWDVBasnYTB2AuZvVSVkxtx5D11qvSLErboUkWmB3Xk\" (expected \"z\")"

  - id: v3
    title: a well-formed did:key for X25519 is refused, not misread as Ed25519
    from: brief
    given:
      did: did:key:z6LSrfRLRF9JYTgT14SdmZzcETZS6nGH8eN8RpQZ8wCGyCX8
    expect:
      throws:
        name: DidKeyError
        message: "not an Ed25519 did:key (unexpected multicodec prefix)"

  - id: v4
    title: a truncated payload is refused as the wrong length
    from: brief
    given:
      did: did:key:z2DQYNBhSR9ai8aa5oCTVS2FDgQ6gUBswarhA2isQWLtF4H
    expect:
      throws:
        name: DidKeyError
        message: "expected 34 multicodec bytes, got 33"

  - id: v5
    title: a payload character outside the base58btc alphabet refuses the whole DID
    from: brief
    given:
      did: did:key:z0abc
    expect:
      throws:
        name: DidKeyError
        message: "invalid base58btc payload in \"did:key:z0abc\" (invalid character \"0\" at position 0)"

  - id: v6
    title: whitespace around a DID is never trimmed away — a padded string is not a did:key
    from: brief
    given:
      did: " did:key:z6MkuSWDVBasnYTB2AuZvVSVkxtx5D11qvSLErboUkWmB3Xk "
    expect:
      throws:
        name: DidKeyError
        message: "not a did:key: \" did:key:z6MkuSWDVBasnYTB2AuZvVSVkxtx5D11qvSLErboUkWmB3Xk \""

  - id: v7
    title: whitespace inside the payload is a payload fault, never trimmed after the prefix matches
    from: brief
    given:
      did: "did:key:z 6MkuSWDVBasnYTB2AuZvVSVkxtx5D11qvSLErboUkWmB3Xk"
    expect:
      throws:
        name: DidKeyError
        message: "invalid base58btc payload in \"did:key:z 6MkuSWDVBasnYTB2AuZvVSVkxtx5D11qvSLErboUkWmB3Xk\" (invalid character \" \" at position 0)"

  - id: v8
    title: the scheme and method match exactly — case-folded is not a did:key
    from: brief
    given:
      did: DID:KEY:z6MkuSWDVBasnYTB2AuZvVSVkxtx5D11qvSLErboUkWmB3Xk
    expect:
      throws:
        name: DidKeyError
        message: "not a did:key: \"DID:KEY:z6MkuSWDVBasnYTB2AuZvVSVkxtx5D11qvSLErboUkWmB3Xk\""

  - id: v9
    title: a payload longer than 34 bytes is refused, never sliced down
    from: brief
    given:
      did: did:key:zQecnTZx7PiXA1pXEAj2K6XXw3iJ5Zy4ivrov9vc9V4MyLAgo
    expect:
      throws:
        name: DidKeyError
        message: "expected 34 multicodec bytes, got 35"
