invariant: RESOLVE-003
operation: publicKeyFromDidKey

vectors:
  - id: v1
    title: another DID method is refused, not resolved
    from: brief
    given:
      did: did:web:synthetism.invalid
    expect:
      throws:
        name: DidKeyError
        message: "not a did:key: \"did:web:synthetism.invalid\""

  - id: v2
    title: a non-z multibase prefix is refused before any decoding
    from: brief
    given:
      did: did:key:Q6MkuSWDVBasnYTB2AuZvVSVkxtx5D11qvSLErboUkWmB3Xk
    expect:
      throws:
        name: DidKeyError
        message: "unsupported multibase prefix in \"did:key:Q6MkuSWDVBasnYTB2AuZvVSVkxtx5D11qvSLErboUkWmB3Xk\" (expected \"z\")"

  - id: v3
    title: a well-formed did:key for another curve is refused, not misread
    from: brief
    given:
      did: did:key:z6MmCfpayyLUabBwbFgz9fcnxBhUKheLb8WRiuZ8LfwXgzn2
    expect:
      throws:
        name: DidKeyError
        message: "not an Ed25519 did:key (unexpected multicodec prefix)"

  - id: v4
    title: a truncated payload is refused as the wrong length
    from: brief
    given:
      did: did:key:z2DQYNBhSR9ai8aa5oCTVS2FDgQ6gUBswarhA2isQWLtF4H
    expect:
      throws:
        name: DidKeyError
        message: "expected 34 multicodec bytes, got 33"

  - id: v5
    title: a payload character outside the base58btc alphabet refuses the whole DID
    from: brief
    given:
      did: did:key:z0abc
    expect:
      throws:
        name: DidKeyError
        message: "invalid base58btc payload in \"did:key:z0abc\" (invalid character \"0\" at position 0)"
