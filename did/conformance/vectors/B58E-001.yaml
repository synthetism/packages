invariant: B58E-001
operation: base58btcEncode

vectors:
  - id: v1
    title: no bytes render as no characters
    from: brief
    given:
      bytesHex: ""
    expect:
      encoded: ""

  - id: v2
    title: each leading zero byte renders as exactly one leading 1
    from: brief
    given:
      bytesHex: 000000ff
    expect:
      encoded: 1115Q

  - id: v3
    title: the multicodec payload renders as the body of its DID
    from: brief
    given:
      bytesHex: ed01deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef
    expect:
      encoded: 6MkuSWDVBasnYTB2AuZvVSVkxtx5D11qvSLErboUkWmB3Xk
