invariant: B58E-001
operation: base58btcEncode

vectors:
  - id: v1
    title: no bytes render as no characters
    from: brief
    given:
      bytesHex: ""
    expect:
      encoded: ""

  - id: v2
    title: each leading zero byte renders as exactly one leading 1
    from: brief
    given:
      bytesHex: 000000ff
    expect:
      encoded: 1115Q

  - id: v3
    title: the multicodec payload renders as the body of its DID
    from: brief
    given:
      bytesHex: ed01deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef
    expect:
      encoded: 6MkuSWDVBasnYTB2AuZvVSVkxtx5D11qvSLErboUkWmB3Xk

  - id: v4
    title: the digits 4 and 7 are the alphabet's own, in their own places
    from: brief
    given:
      bytesHex: 0000b4
    expect:
      encoded: "1147"

  - id: v5
    title: a zero byte inside the input is part of the number, and 9 and F keep their places
    from: brief
    given:
      bytesHex: "016600"
    expect:
      encoded: UF9

  - id: v6
    title: an all-zero input renders as nothing but 1s
    from: brief
    given:
      bytesHex: "0000"
    expect:
      encoded: "11"
