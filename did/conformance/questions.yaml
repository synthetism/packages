# Live questions, to the owner of this suite. A channel, not a ledger.
#
# An answered question leaves this file. The answer lives in BRIEF.md, where it
# can be verified, and the account of what closed it lives in attack.yaml.
#
# A question does not block a gate. The runner reports how many are open and the
# owner decides whether to ship. Ninety per cent conformant and shipped beats
# one hundred per cent and stuck.

