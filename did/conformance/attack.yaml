# The offence and defence record. One record per mutant that survived at
# handover. Nothing else, and no optional keys.
#
# Two pathways and no third one. If an aim can be made, the outcome is a record
# here. If it cannot be made for a reason outside the agent's control, that is a
# question to the owner (questions.yaml) and it is not this file's business.
#
# Flat on purpose. There are no pass numbers: passes are a schedule, a schedule
# is not evidence, and there may be a hundred of them in one week. Scan by
# status, sort by date, read the answers.
#
# `read` says whether the agent had read the implementation when it made the aim.
# A blind aim is recorded here, never assumed.

records:
  - id: a1
    date: 2026-10-29
    mutant: deadbeef lookup
    agent: adversary
    read: blind
    status: closed
    answer: vector blindness. v4 added a second key deriving its own DID.

